- title: "GASスクリプト実行トリガー設定"
  description: "スクリプトを毎日決まった時刻に自動実行する"
  content: |
    function setDailyTrigger() {
      ScriptApp.newTrigger('myFunction')
        .timeBased()
        .everyDays(1)
        .atHour(9)
        .create();
    }
  category: "gas"
  tags: ["トリガー", "自動化"]
  status: private

- title: "GASスプレッドシート取得"
  description: "アクティブなスプレッドシートとシートを取得する"
  content: |
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sheet = ss.getActiveSheet();
  category: "gas"
  tags: ["スプレッドシート", "基本"]
  status: private
